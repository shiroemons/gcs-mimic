[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde_json = "1.0.154"

[package]
name = "gcs-mimic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros", "fs", "io-util"] }
bytes = "1.12.1"
md-5 = { version = "0.11.0", default-features = false }
crc32c = "0.6.8"
getrandom = "0.4.3"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = { version = "0.1.5", features = ["channel"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }
