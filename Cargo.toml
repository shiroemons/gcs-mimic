[workspace]
members = ["xtask", "src/grpc/codegen"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde_json = "1.0.154"

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
# Every `pub` item must be reachable from a crate root; default to pub(crate).
unreachable_pub = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Debugging leftovers and placeholders must never reach a request path.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
ignore_without_reason = "deny"
# "Idiomatic Rust" in AGENTS.md, for the patterns Clippy can decide. Each passes on every
# workspace target, so a new occurrence fails `cargo clippy` in tests and tools as well.
# Borrow by default: copies and allocations the code does not need.
cloned_instead_of_copied = "deny"
inefficient_to_string = "deny"
option_as_ref_cloned = "deny"
large_types_passed_by_value = "deny"
# Use the iterator adapter that names the intent.
needless_for_each = "deny"
flat_map_option = "deny"
filter_map_next = "deny"
map_flatten = "deny"
iter_filter_is_some = "deny"
manual_is_variant_and = "deny"
manual_ok_or = "deny"
explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
redundant_closure_for_method_calls = "deny"
map_unwrap_or = "deny"
assigning_clones = "deny"
implicit_clone = "deny"
# Keep the success path flat: an `else` after a diverging branch, or a `match` on a bool,
# nests what an early return or an `if` states directly.
redundant_else = "deny"
match_bool = "deny"
single_match_else = "deny"
if_not_else = "deny"
needless_continue = "deny"
# Match exhaustively: arms that mean the same thing merge, and a wildcard that stands for one
# variant names it, so a new variant is decided where it is added.
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
# Name what the code uses: no `async` without an `.await`, no `self` that is never read, and
# no integer conversion spelled as a cast or an `if`.
unused_async = "deny"
unused_self = "deny"
bool_to_int_with_if = "deny"
cast_lossless = "deny"
# Encode invariants in types: a checked conversion is `try_from`, not a hand-written range
# test, and a `&mut &mut` or a `ref` binding to a reference hides which value is borrowed.
checked_conversions = "deny"
mut_mut = "deny"
ref_binding_to_reference = "deny"
# `cargo xtask lint` raises this to a warning for production code only; see clippy.toml.
disallowed_methods = "allow"

[profile.dev]
# Line tables keep panic and backtrace locations. Full debug info made a clean
# `cargo test --workspace --no-run` take 60 s instead of 47 s on macOS and its
# incremental state 4.5 GB instead of 3.6 GB; see docs/en/development.md.
debug = "line-tables-only"

# Tests spend most of their time in dependencies (hashing, TLS, SQLite, compression,
# proptest); optimizing only them cut the library tests from 121 s to 79 s on macOS.
# They compile once and stay cached, while gcs-mimic itself stays unoptimized so that
# incremental rebuilds after a source change keep their speed.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Thin LTO with one codegen unit trades a longer release build (about 53 s to
# 130 s on macOS) for a smaller binary (17.6 MB to 13.9 MB stripped); see
# docs/en/binary-distribution.md.
lto = "thin"
codegen-units = 1
# Panics stay unwinding: the server isolates a panic to its connection or task
# instead of aborting the whole process.
panic = "unwind"

[package]
name = "gcs-mimic"
version = "0.28.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros", "fs", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", default-features = false }
bytes = "1.12.2"
memchr = { version = "2.8.3", default-features = false, features = ["std"] }
md-5 = { version = "0.11.0", default-features = false }
crc32c = "0.6.9"
quick-xml = { version = "0.42.0", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
socket2 = { version = "0.6.5", features = ["all"] }
ring = "0.17.14"
httpdate = "1.0.3"
hyper = { version = "1.13.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tonic = { version = "0.14.9", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.9"
prost = "0.14.6"
prost-types = "0.14.6"
# Arrow-key prompts for `gcs-mimic buckets new`; only crossterm, without fuzzy search or macros.
inquire = { version = "0.9.5", default-features = false, features = ["crossterm"] }

[dev-dependencies]
rusqlite = { version = "0.43.0", default-features = false, features = ["trace"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }
# Tests build a raw OS error from an errno value; Windows production code uses no libc.
libc = "0.2.191"
