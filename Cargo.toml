[workspace]
members = ["xtask", "src/grpc/codegen"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Debugging leftovers and placeholders must never reach a request path.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[package]
name = "gcs-mimic"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[test]]
name = "grpc_foundation"
path = "src/grpc/process_tests.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros", "fs", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
bytes = "1.12.1"
md-5 = { version = "0.11.0", default-features = false }
crc32c = "0.6.8"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
libc = "0.2.191"
ring = "0.17.14"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = { version = "0.1.5", features = ["channel"] }
tonic = { version = "0.14.8", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.8"
prost = "0.14.4"
prost-types = "0.14.4"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }
