[workspace]
members = ["xtask", "src/grpc/codegen"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "deny"
# Every `pub` item must be reachable from a crate root; default to pub(crate).
unreachable_pub = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Debugging leftovers and placeholders must never reach a request path.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
# `cargo xtask lint` raises this to a warning for production code only; see clippy.toml.
disallowed_methods = "allow"

[profile.dev]
# Line tables keep panic and backtrace locations. Full debug info made a clean
# `cargo test --workspace --no-run` take 60 s instead of 47 s on macOS and its
# incremental state 4.5 GB instead of 3.6 GB; see docs/en/development.md.
debug = "line-tables-only"

# Tests spend most of their time in dependencies (hashing, TLS, SQLite, compression,
# proptest); optimizing only them cut the library tests from 121 s to 79 s on macOS.
# They compile once and stay cached, while gcs-mimic itself stays unoptimized so that
# incremental rebuilds after a source change keep their speed.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Thin LTO with one codegen unit trades a longer release build (about 53 s to
# 130 s on macOS) for a smaller binary (17.6 MB to 13.9 MB stripped); see
# docs/en/binary-distribution.md.
lto = "thin"
codegen-units = 1
# Panics stay unwinding: the server isolates a panic to its connection or task
# instead of aborting the whole process.
panic = "unwind"

[package]
name = "gcs-mimic"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros", "fs", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
bytes = "1.12.1"
md-5 = { version = "0.11.0", default-features = false }
crc32c = "0.6.9"
quick-xml = { version = "0.42.0", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
libc = "0.2.191"
socket2 = { version = "0.6.5", features = ["all"] }
ring = "0.17.14"
httpdate = "1.0.3"
hyper = { version = "1.12.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tonic = { version = "0.14.9", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.9"
prost = "0.14.4"
prost-types = "0.14.4"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["test-util"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }
