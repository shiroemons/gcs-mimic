[package]
name = "gcs-mimic-scorecard-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

# A standalone probe: it must not join the gcs-mimic workspace or share its lockfile.
[workspace]

[dependencies]
bytes = "=1.12.1"
google-cloud-storage = "=1.22.0"
google-cloud-auth = "=1.19.0"
# The following crates are already in google-cloud-storage's graph; naming them exposes
# the SDK's own request types (field masks, timestamps, IAM bindings, status codes).
google-cloud-gax = "=1.15.0"
google-cloud-iam-v1 = "=1.13.0"
google-cloud-wkt = "=1.11.0"
# Only for sending signed URLs and POST policy forms unchanged; the SDK has no sender.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "multipart"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }
url = "=2.5.8"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "deny"
