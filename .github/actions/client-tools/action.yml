name: Install pinned client tooling
description: Installs the exact .NET SDKs, Java and Maven that the Java and .NET client suites pin.
runs:
  using: composite
  steps:
    # The .NET suite also targets the LTS runtime, and setup-dotnet installs SDKs only, so the
    # exact LTS SDK that carries that runtime is installed beside the global.json SDK that builds.
    - name: Read the pinned LTS .NET SDK
      id: dotnet-lts
      shell: bash
      run: echo "version=$(tr -d '\r\n' < sdk-tests/dotnet/.dotnet-lts-sdk-version)" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ steps.dotnet-lts.outputs.version }}
        global-json-file: sdk-tests/dotnet/global.json
    - name: Install exact Java and Maven client tooling
      shell: bash
      run: |
        tools="$RUNNER_TEMP/gcs-mimic-client-tools"
        mkdir -p "$tools/java"
        java_pin=$(tr -d '\r\n' < sdk-tests/java/.java-version)
        maven_pin=$(tr -d '\r\n' < sdk-tests/java/.maven-version)
        # A blip at a download host must not fail the release gate, and the digests below decide
        # what is accepted however many attempts it took.
        fetch() {
          curl --disable --fail --location --proto '=https' --connect-timeout 20 --max-time 300 \
            --retry 5 --retry-all-errors "$1" -o "$2"
        }
        fetch "https://github.com/adoptium/temurin${java_pin%%.*}-binaries/releases/download/jdk-${java_pin/+/%2B}/OpenJDK${java_pin%%.*}U-jdk_x64_linux_hotspot_${java_pin/+/_}.tar.gz" "$tools/java.tar.gz"
        echo "30cb129f6cf299c852cec0feca9ea2a596d2ee9f26d8605d3a253951f6c8b20f  $tools/java.tar.gz" | sha256sum -c -
        tar -xzf "$tools/java.tar.gz" -C "$tools/java" --strip-components=1
        # Maven Central rather than the Apache archive: the Java clients need Central for every
        # dependency anyway, so the Maven download adds no host that can fail on its own.
        fetch "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$maven_pin/apache-maven-$maven_pin-bin.tar.gz" "$tools/maven.tar.gz"
        echo "908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa  $tools/maven.tar.gz" | sha512sum -c -
        tar -xzf "$tools/maven.tar.gz" -C "$tools"
        echo "JAVA_HOME=$tools/java" >> "$GITHUB_ENV"
        echo "$tools/java/bin" >> "$GITHUB_PATH"
        echo "$tools/apache-maven-$maven_pin/bin" >> "$GITHUB_PATH"
