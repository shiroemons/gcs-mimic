name: Dependency freshness
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tooling
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - run: cargo fetch --locked
      - name: Install digest-pinned protobuf compiler
        run: |
          version=$(jq -r .version src/grpc/codegen/protoc.json)
          digest=$(jq -r .linux_x86_64_sha256 src/grpc/codegen/protoc.json)
          archive="$RUNNER_TEMP/protoc.zip"
          curl --disable --fail --location --proto '=https' --max-time 60 --max-filesize 16777216 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-linux-x86_64.zip" --output "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Verify committed gRPC generation
        if: ${{ !cancelled() }}
        run: bash scripts/check-grpc-codegen.sh
      - name: Check protobuf compiler freshness
        if: ${{ !cancelled() }}
        run: |
          version=$(jq -r .version src/grpc/codegen/protoc.json)
          latest=$(gh api repos/protocolbuffers/protobuf/releases/latest --jq .tag_name)
          if [[ "$latest" != "v$version" ]]; then
            echo "Protobuf compiler update available: pinned v$version, latest $latest; update protoc.json and regenerate gRPC sources" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo fetch --locked --manifest-path sdk-tests/rust/Cargo.toml
        if: ${{ !cancelled() }}
      - name: Check application, all SDK ecosystems, toolchains, Actions and containers
        if: ${{ !cancelled() }}
        run: cargo xtask dependencies check
        env:
          GITHUB_TOKEN: ${{ github.token }}
  # Separate from `freshness`, which keeps failing until a proposal merges: a pending update stays
  # visible, and a failed proposal never hides what the check found.
  rewrite-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tooling
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - run: cargo fetch --locked
      - name: Rewrite the pins of rebuilt images
        run: |
          output="$RUNNER_TEMP/image-refresh"
          mkdir -p "$output"
          cargo xtask dependencies update-images --checked-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$output/record.md"
          git diff --no-ext-diff --binary > "$output/pins.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-refresh
          path: ${{ runner.temp }}/image-refresh
          if-no-files-found: error
          retention-days: 1
  # Compiling runs dependency build scripts, which could alter later steps of the same job through
  # .git/hooks or GITHUB_ENV. So the job that holds write access starts from a clean checkout and
  # compiles nothing; a person reviews what the patch changes before it merges.
  propose-image-refresh:
    needs: rewrite-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-refresh
          path: ${{ runner.temp }}/image-refresh
      - name: Propose the rewritten pins
        run: |
          bash scripts/propose-image-refresh.sh \
            "$RUNNER_TEMP/image-refresh/record.md" "$RUNNER_TEMP/image-refresh/pins.patch"
        env:
          GH_TOKEN: ${{ github.token }}
