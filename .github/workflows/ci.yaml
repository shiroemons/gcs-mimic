name: Foundation checks
on:
  # Documentation-only changes run the documentation workflow instead; it runs
  # the same scripts/check-docs.sh that check.sh runs here. Release workflows
  # call this workflow directly, which these filters do not affect.
  push:
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      # Push events have no inputs and expressions treat null like false, so
      # only an explicit true may skip the job.
      skip-portability:
        type: boolean
        default: false
permissions:
  contents: read
# A newer push supersedes branch and pull request runs. Main keeps every run so
# each commit there has a complete result and refreshes the shared caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # Line tables keep panic locations while shrinking debug builds, which
  # shortens linking (notably MSVC PDBs) and the cached target directories.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        toolchain: [pinned, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected compiler
        shell: bash
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          if [[ '${{ matrix.toolchain }}' == stable ]]; then pin=stable; fi
          rustup toolchain install "$pin" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      # Only main saves, so branches and pull requests reuse its dependency
      # builds without evicting them from the repository cache quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/test-check.sh
      - run: bash sdk-scorecard/test-score.sh
      - run: bash scripts/check.sh
  # Runtime behavior differs by OS (socket resets, timing, file APIs); run one
  # target per OS family on every push instead of only at tag time. Release
  # workflows skip it because their build matrix tests every target natively.
  portability:
    if: inputs.skip-portability != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and target
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - name: Install native musl compiler
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          linker="CARGO_TARGET_${TARGET^^}_LINKER"
          echo "${linker//-/_}=musl-gcc" >> "$GITHUB_ENV"
      # Tests synchronize many small files under the system temporary directory.
      # Windows runners keep it on C:, while the workspace and RUNNER_TEMP use
      # the faster D: volume.
      - name: Keep Windows test files on the workspace volume
        if: runner.os == 'Windows'
        run: printf '%s\n' "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Restored after the compiler environment is final because CC and CARGO
      # variables contribute to the cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - run: cargo test --workspace --target "$TARGET" --locked --offline
        # Deadline tests still use wall-clock budgets; fewer concurrent tests keep
        # slower macOS and Windows runners from starving them.
        env:
          RUST_TEST_THREADS: '2'
  containers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/smoke-containers.sh '${{ matrix.platform }}'
  sdk-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk-tests/go/go.mod
          cache-dependency-path: sdk-tests/go/go.sum
      - name: Install pinned Rust
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: sdk-tests/dotnet/global.json
      - name: Install exact Java and Maven client tooling
        shell: bash
        run: |
          tools="$RUNNER_TEMP/gcs-mimic-client-tools"
          mkdir -p "$tools/java"
          java_pin=$(tr -d '\r\n' < sdk-tests/java/.java-version)
          maven_pin=$(tr -d '\r\n' < sdk-tests/java/.maven-version)
          curl --disable --fail --location --proto '=https' --max-time 300 \
            "https://github.com/adoptium/temurin${java_pin%%.*}-binaries/releases/download/jdk-${java_pin/+/%2B}/OpenJDK${java_pin%%.*}U-jdk_x64_linux_hotspot_${java_pin/+/_}.tar.gz" -o "$tools/java.tar.gz"
          echo "30cb129f6cf299c852cec0feca9ea2a596d2ee9f26d8605d3a253951f6c8b20f  $tools/java.tar.gz" | sha256sum -c -
          tar -xzf "$tools/java.tar.gz" -C "$tools/java" --strip-components=1
          curl --disable --fail --location --proto '=https' --max-time 300 \
            "https://archive.apache.org/dist/maven/maven-3/$maven_pin/binaries/apache-maven-$maven_pin-bin.tar.gz" -o "$tools/maven.tar.gz"
          echo "908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa  $tools/maven.tar.gz" | sha512sum -c -
          tar -xzf "$tools/maven.tar.gz" -C "$tools"
          echo "JAVA_HOME=$tools/java" >> "$GITHUB_ENV"
          echo "$tools/java/bin" >> "$GITHUB_PATH"
          echo "$tools/apache-maven-$maven_pin/bin" >> "$GITHUB_PATH"
      - run: bash -n scripts/sdk-go.sh
      - run: bash scripts/sdk-go.sh --with-clients
      - name: Build the image once for Testcontainers clients
        run: docker build --tag gcs-mimic:client-ci .
      - name: Run the three independent Testcontainers adapters
        env:
          GCS_MIMIC_IMAGE: gcs-mimic:client-ci
        run: |
          bash sdk-tests/java/run.sh --container
          bash sdk-tests/dotnet/run.sh --container
          cd sdk-tests/testcontainers/node
          npm ci --ignore-scripts --no-audit --no-fund
          node scenario.mjs
