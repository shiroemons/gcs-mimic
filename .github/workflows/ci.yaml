name: Foundation checks
on:
  # Documentation-only changes run the documentation workflow instead; it runs
  # the same scripts/check-docs.sh that check.sh runs here. Release workflows
  # call this workflow directly, which these filters do not affect.
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      # Push events have no inputs and expressions treat null like false, so
      # only an explicit true may skip the job.
      skip-portability:
        type: boolean
        default: false
permissions:
  contents: read
# A newer push supersedes branch and pull request runs. Main keeps every run so
# each commit there has a complete result and refreshes the shared caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        toolchain: [pinned, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected compiler
        shell: bash
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          if [[ '${{ matrix.toolchain }}' == stable ]]; then pin=stable; fi
          rustup toolchain install "$pin" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      # Only main saves, so branches and pull requests reuse its dependency
      # builds without evicting them from the repository cache quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/test-check.sh
      - name: Verify pinned gRPC protobuf sources
        run: sha256sum --check src/grpc/proto/SHA256SUMS
      - run: bash scripts/test-grpc-codegen.sh
      - run: bash sdk-scorecard/test-score.sh
      # The cross job type-checks the other targets in parallel; serially they
      # added about 3.5 minutes to this job.
      # RUSTUP_TOOLCHAIN=stable makes Clippy count decreases warnings; the
      # exact pinned compiler requires baseline reductions to be recorded.
      - name: Check with pinned or current-stable lint counts
        run: bash scripts/check.sh
        env:
          GCSM_CHECK_CROSS: '0'
  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        toolchain: [pinned, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected compiler
        shell: bash
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          if [[ '${{ matrix.toolchain }}' == stable ]]; then pin=stable; fi
          rustup toolchain install "$pin" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cross-${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - name: Cross-check with pinned or current-stable lint counts
        run: bash scripts/check-cross.sh
  # Runtime behavior differs by OS (socket resets, timing, file APIs); run one
  # target per OS family on every push instead of only at tag time. Release
  # workflows skip it because their test matrix tests every target natively.
  portability:
    if: inputs.skip-portability != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and target
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - name: Install native musl compiler
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          linker="CARGO_TARGET_${TARGET^^}_LINKER"
          echo "${linker//-/_}=musl-gcc" >> "$GITHUB_ENV"
      # Tests synchronize many small files under the system temporary directory.
      # Windows runners keep it on C:, while the workspace and RUNNER_TEMP use
      # the faster D: volume.
      - name: Keep Windows test files on the workspace volume
        if: runner.os == 'Windows'
        run: printf '%s\n' "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Restored after the compiler environment is final because CC and CARGO
      # variables contribute to the cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      # Without --no-fail-fast the first failing test target hides every later one, and each
      # platform-only failure costs a full run of its own.
      - run: cargo test --workspace --target "$TARGET" --locked --offline --no-fail-fast
        # Deadline tests still use wall-clock budgets; fewer concurrent tests keep
        # slower macOS and Windows runners from starving them.
        env:
          RUST_TEST_THREADS: '2'
  containers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/smoke-containers.sh '${{ matrix.platform }}'
  sdk-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk-tests/go/go.mod
          cache-dependency-path: sdk-tests/go/go.sum
      - name: Install pinned Rust
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/client-tools
      - run: bash -n scripts/sdk-go.sh
      - run: bash scripts/sdk-go.sh --with-clients
  # The release image build takes about 6 minutes, so the Testcontainers
  # clients run beside the SDK suites instead of after them.
  testcontainers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/client-tools
      - name: Build the image once for Testcontainers clients
        # The runner has 4 vCPUs; the Dockerfile defaults to 2 Cargo jobs for
        # local parallel multi-architecture builds.
        run: docker build --build-arg CARGO_BUILD_JOBS=4 --tag gcs-mimic:client-ci .
      - name: Run the three independent Testcontainers adapters
        env:
          GCS_MIMIC_IMAGE: gcs-mimic:client-ci
        run: |
          bash sdk-tests/java/run.sh --container
          bash sdk-tests/dotnet/run.sh --container
          cd sdk-tests/testcontainers/node
          npm ci --ignore-scripts --no-audit --no-fund
          node scenario.mjs
