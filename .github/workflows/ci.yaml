name: Foundation checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # Push events have no inputs and expressions treat null like false, so
      # only an explicit true may skip the job.
      skip-portability:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain: [pinned, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected compiler
        shell: bash
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          if [[ '${{ matrix.toolchain }}' == stable ]]; then pin=stable; fi
          rustup toolchain install "$pin" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - run: bash scripts/test-check.sh
      - run: bash scripts/check.sh
  # Runtime behavior differs by OS (socket resets, timing, file APIs); run one
  # target per OS family on every push instead of only at tag time. Release
  # workflows skip it because their build matrix tests every target natively.
  portability:
    if: inputs.skip-portability != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and target
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - name: Install native musl compiler
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          linker="CARGO_TARGET_${TARGET^^}_LINKER"
          echo "${linker//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo fetch --locked
      - run: cargo test --workspace --target "$TARGET" --locked --offline
        # Deadline tests still use wall-clock budgets; fewer concurrent tests keep
        # slower macOS and Windows runners from starving them.
        env:
          RUST_TEST_THREADS: '2'
  containers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/smoke-containers.sh '${{ matrix.platform }}'
  sdk-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk-tests/go/go.mod
          cache-dependency-path: sdk-tests/go/go.sum
      - name: Install pinned Rust
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
      - run: bash -n scripts/sdk-go.sh
      - run: bash scripts/sdk-go.sh
