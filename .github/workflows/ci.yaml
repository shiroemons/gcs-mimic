name: Foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain: [pinned, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected compiler
        shell: bash
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          if [[ '${{ matrix.toolchain }}' == stable ]]; then pin=stable; fi
          rustup toolchain install "$pin" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
      - run: cargo xtask compatibility check
      - run: bash -n scripts/smoke-containers.sh
      - name: Check smoke command validation
        run: |
          bash scripts/smoke-containers.sh --help
          if bash scripts/smoke-containers.sh linux/unknown; then exit 1; else test "$?" = 2; fi
  containers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/smoke-containers.sh '${{ matrix.platform }}'
  sdk-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk-tests/go/go.mod
          cache-dependency-path: sdk-tests/go/go.sum
      - name: Install pinned Rust
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
      - run: bash -n scripts/sdk-go.sh
      - run: bash scripts/sdk-go.sh
