name: Publish release container
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  VERSION: ${{ inputs.version }}
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
  SBOM_GENERATOR: docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
jobs:
  platform:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
            runner_arch: X64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
            runner_arch: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCHITECTURE: ${{ matrix.architecture }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      TEST_IMAGE: gcs-mimic:release-verification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure native build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$VERSION"
          printf '%s\n' "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" \
            "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" \
            "BUILDER_NAME=ghcr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCHITECTURE" \
            "DOCKER_CONFIG=$RUNNER_TEMP/ghcr-docker" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ghcr-docker"
          docker version
          docker buildx version
      - name: Start pinned BuildKit
        run: |
          docker buildx create --name "$BUILDER_NAME" --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --use
          docker buildx inspect --bootstrap
      - name: Build executable image for verification
        run: |
          docker buildx build --platform "$PLATFORM" --load --tag "$TEST_IMAGE" \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --provenance=false --sbom=false .
          test "$(docker run --rm --network none "$TEST_IMAGE" --version)" = "gcs-mimic $VERSION"
          # Docker image IDs can identify manifests instead of configs with a containerd store.
          docker image save --output "$RUNNER_TEMP/tested-image.tar" "$TEST_IMAGE"
          config=$(tar -xOf "$RUNNER_TEMP/tested-image.tar" manifest.json \
            | jq -er 'if length == 1 then .[0].Config else error("expected one tested image") end')
          [[ "$config" =~ ^([a-f0-9]{64}\.json|blobs/sha256/[a-f0-9]{64})$ ]]
          hash=$(tar -xOf "$RUNNER_TEMP/tested-image.tar" "$config" | sha256sum)
          printf 'sha256:%s\n' "${hash%% *}" > "$RUNNER_TEMP/tested-config-digest"
          rm "$RUNNER_TEMP/tested-image.tar"
      - name: Verify the built image on its native CPU
        run: bash scripts/smoke-containers.sh --image "$TEST_IMAGE" "$PLATFORM"
      - name: Authenticate after verification
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Push verified platform by digest with attestations
        run: |
          docker buildx build --platform "$PLATFORM" \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --provenance=mode=max --sbom "generator=$SBOM_GENERATOR" \
            --metadata-file "$RUNNER_TEMP/pushed-metadata.json" .
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/pushed-metadata.json")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect --raw "$IMAGE@$digest" > "$RUNNER_TEMP/pushed-index.json"
          manifest=$(jq -er --arg os "${PLATFORM%%/*}" --arg arch "$ARCHITECTURE" \
            '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch)]
             | if length == 1 then .[0].digest else error("expected one runtime platform manifest") end' \
            "$RUNNER_TEMP/pushed-index.json")
          [[ "$manifest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect --raw "$IMAGE@$manifest" > "$RUNNER_TEMP/pushed-runtime.json"
          pushed=$(jq -er '.config.digest | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/pushed-runtime.json")
          tested=$(cat "$RUNNER_TEMP/tested-config-digest")
          test "$tested" = "$pushed"
          mkdir -p digests
          printf '%s\n' "$digest" > "digests/$ARCHITECTURE.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghcr-digest-${{ matrix.architecture }}
          path: digests/*.digest
          if-no-files-found: error
      - name: Remove registry credentials and builder
        if: always()
        run: |
          if [[ -d "$DOCKER_CONFIG" ]]; then docker logout ghcr.io; fi
          if [[ -n "${BUILDER_NAME:-}" ]]; then docker buildx rm "$BUILDER_NAME"; fi
  manifest:
    needs: platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ghcr-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ghcr-digest-*
          path: digests
          merge-multiple: true
      - name: Install pinned policy tooling
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - run: cargo fetch --locked
      - name: Authenticate for manifest publication
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-docker"
          printf '%s\n' "DOCKER_CONFIG=$DOCKER_CONFIG" "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Publish immutable version and current aliases
        run: bash scripts/container-release.sh "$VERSION" digests
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
