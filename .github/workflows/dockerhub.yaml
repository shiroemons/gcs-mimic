name: Mirror release container to Docker Hub
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already published to GHCR, for example 0.2.1
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  VERSION: ${{ inputs.version }}
jobs:
  mirror:
    # Tag releases call this after GHCR publication. Manual runs from main backfill
    # versions whose GHCR index and digest report already exist.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The environment confines the Docker Hub token to release tags and main.
    environment: dockerhub
    concurrency:
      group: dockerhub-publish
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned policy tooling
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - run: cargo fetch --locked
      - name: Authenticate to Docker Hub
        env:
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/dockerhub-docker"
          printf '%s\n' "DOCKER_CONFIG=$DOCKER_CONFIG" \
            "SOURCE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" \
            "IMAGE=docker.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login docker.io --username "$REGISTRY_USER" --password-stdin
      - name: Copy the verified index and current aliases
        run: bash scripts/container-mirror.sh "$VERSION"
      - name: Remove registry credentials
        if: always()
        run: docker logout docker.io
