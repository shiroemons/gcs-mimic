name: Release binaries
# Run blocks exercised by scripts/test-release-workflows.sh must work with macOS Bash 3.2.
on:
  workflow_dispatch:
    inputs:
      reuse-dry-run:
        description: Rehearse a tag's path, reusing this commit's last dry run without publishing
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      reuse: ${{ steps.binaries.outputs.reuse }}
      binaries-run: ${{ steps.binaries.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
      - run: cargo fetch --locked
      - name: Verify version and release notes
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A suffix preserves trailing newlines so validation cannot normalize malformed input.
          version=$(cargo metadata --locked --offline --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "gcs-mimic") | .version + "@"')
          version=${version%@}
          bash scripts/release-version.sh "$version" > /dev/null
          if [[ "$REF_TYPE" == tag ]]; then
            test "$REF_NAME" = "v$version"
            # Fail on a broken notes link before the platform builds start.
            bash scripts/release-notes.sh "docs/en/releases/$version.md" "$REF_NAME" > /dev/null
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Only inputs that build or ship the release gate it; the daily check covers the rest.
      - run: cargo xtask dependencies check --scope release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Testing the same commit again adds waiting, not assurance, so a tag publishes what its dry
      # run tested and built.
      - name: Choose the binaries to publish
        id: binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ github.event_name == 'push' || inputs.reuse-dry-run }}
        run: |
          run=$GITHUB_RUN_ID
          if [[ "$REUSE" == true ]]; then run=$(bash scripts/find-release-dry-run.sh "$GITHUB_SHA"); fi
          echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
  foundation:
    needs: validate
    if: needs.validate.outputs.reuse != 'true'
    uses: ./.github/workflows/ci.yaml
    with:
      skip-portability: true
  # Foundation covers fmt and OS/ABI Clippy; repeating them per architecture adds no coverage.
  # Keep the test and build matrices in sync; publish requires both to pass.
  test:
    needs: validate
    if: needs.validate.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            host: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            host: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-pc-windows-msvc
            host: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            host: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-unknown-linux-gnu
            host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    # Intel macOS and Windows ARM need over 30 minutes for the whole suite, and their compile time
    # alone varies by several minutes between runs.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and native target
        run: |
          expected_arch=X64
          if [[ "$HOST" == aarch64-* ]]; then expected_arch=ARM64; fi
          test "$RUNNER_ARCH" = "$expected_arch"
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          toolchain="$pin-$HOST"
          rustup toolchain install "$toolchain" --force-non-host --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Install native musl compiler
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          linker="CARGO_TARGET_${TARGET^^}_LINKER"
          echo "${linker//-/_}=musl-gcc" >> "$GITHUB_ENV"
      # As in the Foundation portability lane, Windows tests keep their many small
      # synchronized files on the faster D: volume instead of the system temp on C:.
      - name: Keep Windows test files on the workspace volume
        if: runner.os == 'Windows'
        run: printf '%s\n' "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Use the static CRT for Windows tests
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      # Restored after the compiler environment is final because CC, RUSTFLAGS and CARGO variables
      # contribute to the cache key. The build job takes no cache: it makes what is published.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      # Without --no-fail-fast the first failing test target hides every later one, and each
      # platform-only failure costs a full run of its own.
      - run: cargo test --workspace --target "$TARGET" --locked --offline --no-fail-fast
        # Deadline tests still use wall-clock budgets; fewer concurrent tests keep
        # slower macOS, Windows and ARM runners from starving them.
        env:
          RUST_TEST_THREADS: '2'
  build:
    needs: validate
    if: needs.validate.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        # Asset counts in `publish` follow this matrix.
        include:
          - target: aarch64-apple-darwin
            host: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            host: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-pc-windows-msvc
            host: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            host: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-unknown-linux-gnu
            host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      HOST: ${{ matrix.host }}
      VERSION: ${{ needs.validate.outputs.version }}
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and native target
        run: |
          expected_arch=X64
          if [[ "$HOST" == aarch64-* ]]; then expected_arch=ARM64; fi
          test "$RUNNER_ARCH" = "$expected_arch"
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          toolchain="$pin-$HOST"
          rustup toolchain install "$toolchain" --force-non-host --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Remove local source paths from binaries
        run: |
          workspace=$GITHUB_WORKSPACE
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          if [[ "$RUNNER_OS" == Windows ]]; then
            workspace=$(cygpath -w "$workspace")
            cargo_home=$(cygpath -w "$cargo_home")
          fi
          flags=("--remap-path-prefix=$cargo_home=/build/cargo" "--remap-path-prefix=$workspace=/build/source")
          if [[ "$RUNNER_OS" == Windows ]]; then flags+=('-C' 'target-feature=+crt-static'); fi
          printf -v encoded '%s\x1f' "${flags[@]}"
          echo "CARGO_ENCODED_RUSTFLAGS=${encoded%$'\x1f'}" >> "$GITHUB_ENV"
      - name: Install native musl compiler
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          linker="CARGO_TARGET_${TARGET^^}_LINKER"
          echo "${linker//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Collect native Linux runtime notices
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/release-notices
          gcc_version=$(cc -dumpversion)
          cp "/usr/share/doc/gcc-$gcc_version-base/copyright" target/release-notices/GCC-COPYRIGHT
      - name: Preserve complete musl source notices
        if: endsWith(matrix.target, '-musl')
        run: |
          cp distribution/notices/musl-1.2.5/musl-1.2.5.tar.gz target/release-notices/
          echo 'a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  target/release-notices/musl-1.2.5.tar.gz' | sha256sum --check
      - run: cargo fetch --locked
      - run: cargo build --release --locked --offline --target "$TARGET" --bin gcs-mimic
      - name: Verify Windows runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $tools = @(& $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe')
          if ($LASTEXITCODE -ne 0 -or $tools.Count -eq 0) { throw 'MSVC dumpbin is unavailable' }
          $preferred = if ($env:RUNNER_ARCH -eq 'ARM64') { 'Hostarm64.arm64' } else { 'Hostx64.x64' }
          $dumpbin = $tools | Where-Object { $_ -match $preferred } | Select-Object -First 1
          if (-not $dumpbin) { $dumpbin = $tools[0] }
          $imports = & $dumpbin /nologo /dependents "target/$env:TARGET/release/gcs-mimic.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect executable DLL imports' }
          $imports | Write-Output
          if (-not ($imports -match '\.dll')) { throw 'No DLL imports found in inspection output' }
          if ($imports -match '(?i)\b(VCRUNTIME\S*|MSVCP\d\S*|MSVCR\d\S*|CONCRT\S*|UCRTBASED?|API-MS-WIN-CRT-\S*|SQLITE3)\.DLL\b') {
            throw 'Executable requires an external CRT or SQLite DLL'
          }
      - name: Prepare licensed distribution
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          cargo xtask release prepare "$TARGET" "target/$TARGET/release/gcs-mimic$suffix" "dist/gcs-mimic-$VERSION-$TARGET"
      - name: Archive Unix distribution
        if: runner.os != 'Windows'
        run: |
          name="gcs-mimic-$VERSION-$TARGET"
          if [[ "$RUNNER_OS" == macOS ]]; then
            COPYFILE_DISABLE=1 tar --uid 0 --gid 0 --uname root --gname root -czf "dist/$name.tar.gz" -C dist "$name"
          else
            tar --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" -C dist "$name"
          fi
          cd dist
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Archive Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "gcs-mimic-$env:VERSION-$env:TARGET"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          # Set-Content ends lines with CRLF, which macOS `shasum --check` does not match.
          [System.IO.File]::WriteAllText("dist/$name.zip.sha256", "$hash  $name.zip`n", [System.Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
  # Manual dispatch runs this job through read-only flag calculation, so publication
  # mistakes surface before an immutable tag; only tag pushes create the Release.
  publish:
    # The gates are skipped only when their dry run on this commit already passed them. A skipped
    # job skips what needs it unless the condition names results, so the jobs below do too.
    if: >-
      !cancelled() && needs.validate.result == 'success' && (needs.validate.outputs.reuse == 'true'
      || (needs.foundation.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success'))
    needs: [validate, foundation, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      # A dry run must not displace a queued tag publication.
      group: binaries-publish-${{ github.event_name == 'push' && 'tags' || github.run_id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned policy tooling
        shell: bash
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - run: cargo fetch --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
          # Set on every run, so each dry run also exercises the download a tag depends on.
          run-id: ${{ needs.validate.outputs.binaries-run }}
          github-token: ${{ github.token }}
      - name: Verify complete release assets
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          checksums=(dist/*.sha256)
          test "${#archives[@]}" = 8
          test "${#checksums[@]}" = 8
          cd dist
          # GNU sha256sum tolerates CRLF but macOS shasum does not, so publish LF only
          # and require each entry to be exactly one digest and archive name.
          cat ./*.sha256 | tr -d '\r' > SHA256SUMS
          test "$(grep -c $'\r' SHA256SUMS)" = 0
          test "$(grep -cE '^[0-9a-f]{64}  gcs-mimic-[^ /]+\.(tar\.gz|zip)$' SHA256SUMS)" = 8
          test "$(wc -l < SHA256SUMS)" = 8
          sha256sum --check SHA256SUMS
      - name: List assets for the Release
        shell: bash
        run: |
          # nullglob keeps an unmatched archive glob from being passed literally.
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS)
          test "${#assets[@]}" = 9
          printf '%s\n' "${assets[@]}" | tee release-assets
          # A dry run from a branch links to its commit; branch names may contain a slash.
          ref=$RELEASE_TAG
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then ref=$GITHUB_SHA; fi
          bash scripts/release-notes.sh "docs/en/releases/$VERSION.md" "$ref" > release-notes.md
      - name: Calculate publication flags
        shell: bash
        run: |
          stage=$(bash scripts/release-version.sh "$VERSION")
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(startswith("v")) | ltrimstr("v")')
          policy_args=("$VERSION")
          while IFS= read -r version; do
            if [[ -n "$version" ]]; then policy_args+=("$version"); fi
          done <<< "$published"
          tags=$(cargo xtask release container-tags "${policy_args[@]}")
          latest=false
          while IFS= read -r tag; do
            if [[ "$tag" == latest ]]; then latest=true; fi
          done <<< "$tags"
          release_flags=("--latest=$latest")
          if [[ "$stage" == candidate ]]; then release_flags+=(--prerelease); fi
          printf '%s\n' "${release_flags[@]}" > release-flags
          printf 'Release flags:'
          printf ' %s' "${release_flags[@]}"
          printf '\n'
      - name: Publish verified tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          type=$(jq -er '.object.type' <<< "$object")
          sha=$(jq -er '.object.sha' <<< "$object")
          while [[ "$type" == tag ]]; do
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
            type=$(jq -er '.object.type' <<< "$object")
            sha=$(jq -er '.object.sha' <<< "$object")
          done
          test "$type" = commit
          test "$sha" = "$GITHUB_SHA"
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          while IFS= read -r tag; do
            if [[ "$tag" == "$RELEASE_TAG" ]]; then
              echo 'A release already exists for this immutable tag' >&2
              exit 1
            fi
          done <<< "$releases"
          assets=()
          while IFS= read -r asset; do assets+=("$asset"); done < release-assets
          release_flags=()
          while IFS= read -r flag; do release_flags+=("$flag"); done < release-flags
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md "${release_flags[@]}"
  publish-container:
    if: >-
      !cancelled() && needs.publish.result == 'success'
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, publish]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/ghcr.yaml
    with:
      version: ${{ needs.validate.outputs.version }}
  publish-dockerhub:
    if: >-
      !cancelled() && needs.publish-container.result == 'success'
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, publish-container]
    permissions:
      contents: read
    uses: ./.github/workflows/dockerhub.yaml
    # A called workflow receives no secrets unless the caller passes them, even
    # from the environment its job selects; the v0.3.0 tag run logged in with an
    # empty token. This caller has no environment, so it cannot name the token.
    secrets: inherit
    with:
      version: ${{ needs.validate.outputs.version }}
