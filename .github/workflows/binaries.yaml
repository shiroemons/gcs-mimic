name: Release binaries
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: |
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          rustup toolchain install "$pin" --profile minimal
      - run: cargo fetch --locked
      - name: Verify version and release notes
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --locked --offline --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "gcs-mimic") | .version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Binary releases require a stable MAJOR.MINOR.PATCH version' >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == tag ]]; then
            test "$REF_NAME" = "v$version"
            test -s "docs/en/releases/$version.md"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo xtask dependencies check
        env:
          GITHUB_TOKEN: ${{ github.token }}
  foundation:
    needs: validate
    uses: ./.github/workflows/ci.yaml
    with:
      skip-portability: true
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # Asset counts in `publish` follow this matrix.
        include:
          - target: aarch64-apple-darwin
            host: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            host: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-pc-windows-msvc
            host: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            host: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-unknown-linux-gnu
            host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      HOST: ${{ matrix.host }}
      VERSION: ${{ needs.validate.outputs.version }}
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # Test builds keep panic locations with less debug info, which shortens
      # linking; the release profile that produces the archives is unaffected.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and native target
        run: |
          expected_arch=X64
          if [[ "$HOST" == aarch64-* ]]; then expected_arch=ARM64; fi
          test "$RUNNER_ARCH" = "$expected_arch"
          pin=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          toolchain="$pin-$HOST"
          rustup toolchain install "$toolchain" --force-non-host --profile minimal --component rustfmt --component clippy --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Remove local source paths from binaries
        run: |
          workspace=$GITHUB_WORKSPACE
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          if [[ "$RUNNER_OS" == Windows ]]; then
            workspace=$(cygpath -w "$workspace")
            cargo_home=$(cygpath -w "$cargo_home")
          fi
          flags=("--remap-path-prefix=$cargo_home=/build/cargo" "--remap-path-prefix=$workspace=/build/source")
          if [[ "$RUNNER_OS" == Windows ]]; then flags+=('-C' 'target-feature=+crt-static'); fi
          printf -v encoded '%s\x1f' "${flags[@]}"
          echo "CARGO_ENCODED_RUSTFLAGS=${encoded%$'\x1f'}" >> "$GITHUB_ENV"
      - name: Install native musl compiler
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          linker="CARGO_TARGET_${TARGET^^}_LINKER"
          echo "${linker//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Collect native Linux runtime notices
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/release-notices
          gcc_version=$(cc -dumpversion)
          cp "/usr/share/doc/gcc-$gcc_version-base/copyright" target/release-notices/GCC-COPYRIGHT
      - name: Preserve complete musl source notices
        if: endsWith(matrix.target, '-musl')
        run: |
          curl --fail --show-error --location --max-time 120 \
            https://musl.libc.org/releases/musl-1.2.5.tar.gz \
            --output target/release-notices/musl-1.2.5.tar.gz
          echo 'a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  target/release-notices/musl-1.2.5.tar.gz' | sha256sum --check
      # As in the Foundation portability lane, Windows tests keep their many small
      # synchronized files on the faster D: volume instead of the system temp on C:.
      - name: Keep Windows test files on the workspace volume
        if: runner.os == 'Windows'
        run: printf '%s\n' "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --target "$TARGET" --locked --offline -- -D warnings
      - run: cargo test --workspace --target "$TARGET" --locked --offline
        # Deadline tests still use wall-clock budgets; fewer concurrent tests keep
        # slower macOS, Windows and ARM runners from starving them.
        env:
          RUST_TEST_THREADS: '2'
      - run: cargo build --release --locked --offline --target "$TARGET" --bin gcs-mimic
      - name: Verify Windows runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $tools = @(& $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe')
          if ($LASTEXITCODE -ne 0 -or $tools.Count -eq 0) { throw 'MSVC dumpbin is unavailable' }
          $preferred = if ($env:RUNNER_ARCH -eq 'ARM64') { 'Hostarm64.arm64' } else { 'Hostx64.x64' }
          $dumpbin = $tools | Where-Object { $_ -match $preferred } | Select-Object -First 1
          if (-not $dumpbin) { $dumpbin = $tools[0] }
          $imports = & $dumpbin /nologo /dependents "target/$env:TARGET/release/gcs-mimic.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect executable DLL imports' }
          $imports | Write-Output
          if (-not ($imports -match '\.dll')) { throw 'No DLL imports found in inspection output' }
          if ($imports -match '(?i)\b(VCRUNTIME\S*|MSVCP\d\S*|MSVCR\d\S*|CONCRT\S*|UCRTBASED?|API-MS-WIN-CRT-\S*|SQLITE3)\.DLL\b') {
            throw 'Executable requires an external CRT or SQLite DLL'
          }
      - name: Prepare licensed distribution
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          cargo xtask release prepare "$TARGET" "target/$TARGET/release/gcs-mimic$suffix" "dist/gcs-mimic-$VERSION-$TARGET"
      - name: Archive Unix distribution
        if: runner.os != 'Windows'
        run: |
          name="gcs-mimic-$VERSION-$TARGET"
          if [[ "$RUNNER_OS" == macOS ]]; then
            COPYFILE_DISABLE=1 tar --uid 0 --gid 0 --uname root --gname root -czf "dist/$name.tar.gz" -C dist "$name"
          else
            tar --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" -C dist "$name"
          fi
          cd dist
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Archive Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "gcs-mimic-$env:VERSION-$env:TARGET"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          # Set-Content ends lines with CRLF, which macOS `shasum --check` does not match.
          [System.IO.File]::WriteAllText("dist/$name.zip.sha256", "$hash  $name.zip`n", [System.Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
  # Manual dispatch runs this job as a dry run up to the asset list, so publication
  # mistakes surface before an immutable tag; only tag pushes create the Release.
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [validate, foundation, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Verify complete release assets
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          checksums=(dist/*.sha256)
          test "${#archives[@]}" = 8
          test "${#checksums[@]}" = 8
          cd dist
          # GNU sha256sum tolerates CRLF but macOS shasum does not, so publish LF only
          # and require each entry to be exactly one digest and archive name.
          cat ./*.sha256 | tr -d '\r' > SHA256SUMS
          test "$(grep -c $'\r' SHA256SUMS)" = 0
          test "$(grep -cE '^[0-9a-f]{64}  gcs-mimic-[^ /]+\.(tar\.gz|zip)$' SHA256SUMS)" = 8
          test "$(wc -l < SHA256SUMS)" = 8
          sha256sum --check SHA256SUMS
      - name: List assets for the Release
        shell: bash
        run: |
          # nullglob keeps an unmatched archive glob from being passed literally.
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS)
          test "${#assets[@]}" = 9
          printf '%s\n' "${assets[@]}" | tee release-assets
          test -s "docs/en/releases/$VERSION.md"
      - name: Publish verified tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          type=$(jq -er '.object.type' <<< "$object")
          sha=$(jq -er '.object.sha' <<< "$object")
          while [[ "$type" == tag ]]; do
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
            type=$(jq -er '.object.type' <<< "$object")
            sha=$(jq -er '.object.sha' <<< "$object")
          done
          test "$type" = commit
          test "$sha" = "$GITHUB_SHA"
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          while IFS= read -r tag; do
            if [[ "$tag" == "$RELEASE_TAG" ]]; then
              echo 'A release already exists for this immutable tag' >&2
              exit 1
            fi
          done <<< "$releases"
          mapfile -t assets < release-assets
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --title "$RELEASE_TAG" --notes-file "docs/en/releases/$VERSION.md"
  publish-container:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, publish]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/ghcr.yaml
    with:
      version: ${{ needs.validate.outputs.version }}
