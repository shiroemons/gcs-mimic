# How an application's services connect to gcs-mimic's strict local recipe: a Go API, a Rails
# app and a browser frontend. Local development and tests only: the test signer's key is public.
services:
  gcs:
    image: ${GCS_MIMIC_IMAGE:-ghcr.io/shiroemons/gcs-mimic:0.15.0}
    ports:
      # Equal host and container ports let Rails hand the browser the URL it uses itself.
      # Never publish the trusted port 4444.
      - "127.0.0.1:${GCS_MIMIC_PORT:-4443}:${GCS_MIMIC_PORT:-4443}"
    environment:
      GCS_MIMIC_SCHEME: http
      GCS_MIMIC_LISTEN: 0.0.0.0:${GCS_MIMIC_PORT:-4443}
      GCS_MIMIC_AUTH_MODE: strict
      GCS_MIMIC_TRUSTED_LISTEN: 0.0.0.0:4444
      GCS_MIMIC_TEST_SIGNER: enabled
      GCS_MIMIC_BUCKETS: |
        {"version": 1, "project": "local-project", "buckets": [
          {"name": "app-public",
           "iamPolicy": {"bindings": [{"role": "roles/storage.objectViewer", "members": ["allUsers"]}]},
           "cors": [{"origin": ["http://localhost:${FRONTEND_PORT:-3000}"], "method": ["GET", "HEAD"],
                     "responseHeader": ["Content-Type"], "maxAgeSeconds": 3600}]},
          {"name": "app-private",
           "cors": [{"origin": ["http://localhost:${FRONTEND_PORT:-3000}", "http://localhost:${WEB_PORT:-3001}"],
                     "method": ["PUT"],
                     "responseHeader": ["Content-Type", "Content-MD5", "Content-Disposition",
                                        "Cache-Control", "x-goog-content-length-range"],
                     "maxAgeSeconds": 3600}]}
        ]}
    networks:
      default:
        # Containers reach this service as gcs.localhost; browsers send *.localhost to this machine.
        aliases: [gcs.localhost]
    volumes:
      - gcs-data:/var/lib/gcs-mimic
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, gcs-mimic, healthcheck]
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 15

  api:
    build: ./api
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      # Go storage sends no credentials here, and the trusted listener admits it.
      STORAGE_EMULATOR_HOST: gcs:4444
      # The API's own settings for the URLs it signs for the browser.
      GCS_BROWSER_HOST: localhost:${GCS_MIMIC_PORT:-4443}
      GCS_SIGNER_EMAIL: test-signer@gcs-mimic.invalid
      GCS_SIGNER_KEY_FILE: /run/secrets/gcs-test-signer
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    secrets: [gcs-test-signer]
    depends_on:
      gcs:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    environment:
      # Rails requests and the URLs it gives the browser share this endpoint.
      GCS_EMULATOR_ENDPOINT: http://gcs.localhost:${GCS_MIMIC_PORT:-4443}/
      GCS_EMULATOR_KEY_FILE: /run/secrets/gcs-test-signer
    secrets: [gcs-test-signer]
    depends_on:
      gcs:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      API_ORIGIN: http://localhost:${API_PORT:-8080}
      PUBLIC_BUCKET_URL: http://localhost:${GCS_MIMIC_PORT:-4443}/app-public

secrets:
  # The built-in test signer's private key, saved once as the README shows.
  gcs-test-signer:
    file: ./test-signer.pem
volumes:
  gcs-data:
