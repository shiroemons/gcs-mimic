services:
  gcs:
    environment:
      GCS_MIMIC_SCHEME: https
      GCS_MIMIC_TLS_CERT: /tls/server.pem
      GCS_MIMIC_TLS_KEY: /tls/server.key
    volumes:
      - ${GCSM_TLS_DIR:?Set GCSM_TLS_DIR to the throwaway certificate directory}:/tls:ro
    healthcheck:
      test: [CMD, gcs-mimic, healthcheck, --ca-cert, /tls/ca.pem]
