# Thresholds for the lints that `cargo xtask lint` checks; see "Rust implementation
# guardrails" in AGENTS.md. Default Clippy runs do not enable these lints.

# Long enough for a rustfmt-formatted handler with a match over its cases; the review
# found request handlers of 250 to 800 lines that this rejects.
too-many-lines-threshold = 120

# Any bool parameter counts: literal `true`/`false` call sites hide meaning, so a mode
# becomes a two-variant enum. A private helper forwarding a stored or wire boolean keeps
# it under a reasoned `#[expect]`; see "Rust implementation guardrails" in AGENTS.md.
max-fn-params-bools = 0

# Tests may unwrap and expect; production code must not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
