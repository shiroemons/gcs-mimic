# Configuration for the Clippy lints behind "Rust implementation guardrails" in AGENTS.md.
# The thresholds and `disallowed-methods` apply to lints that only `cargo xtask lint` enables;
# `disallowed-types` is checked by every Clippy run.

# Long enough for a rustfmt-formatted handler with a match over its cases; the review
# found request handlers of 250 to 800 lines that this rejects.
too-many-lines-threshold = 120

# Any bool parameter counts: literal `true`/`false` call sites hide meaning, so a mode
# becomes a two-variant enum. A private helper forwarding a stored or wire boolean keeps
# it under a reasoned `#[expect]`; see "Rust implementation guardrails" in AGENTS.md.
max-fn-params-bools = 0

# Channel checks for a queued frame before it checks for a dropped sender, so a producer
# that sends its last chunk and drops between those checks loses that chunk and the
# response ends short of its Content-Length. Use crate::server::chunk_body instead.
disallowed-types = [
    { path = "http_body_util::Channel", reason = "loses the last frame when the sender drops mid-poll; use crate::server::chunk_body" },
]

# `disallowed_methods` is allowed in `[workspace.lints]` and enabled only by `cargo xtask lint`
# for production code, so tests may spawn tasks and run ad-hoc SQL freely. The supervised
# helpers in src/task.rs and request-free catalog code keep their calls under a reasoned
# `#[expect(clippy::disallowed_methods)]`.
disallowed-methods = [
    # A dropped JoinHandle or a dead thread hides the panic or error.
    { path = "tokio::spawn", reason = "unsupervised; use crate::task::spawn_supervised" },
    { path = "tokio::task::spawn", reason = "unsupervised; use crate::task::spawn_supervised" },
    { path = "tokio::task::spawn_local", reason = "unsupervised; use crate::task::spawn_supervised" },
    { path = "tokio::runtime::Handle::spawn", reason = "unsupervised; use crate::task::spawn_supervised_on" },
    { path = "tokio::runtime::Runtime::spawn", reason = "unsupervised; use crate::task::spawn_supervised_on" },
    { path = "std::thread::spawn", reason = "unsupervised; use crate::task::spawn_thread" },
    { path = "std::thread::Builder::spawn", reason = "unsupervised; use crate::task::spawn_thread" },
    # These prepare their SQL on every call, which wastes CPU on request paths. Calls through
    # a Transaction resolve to them too; Statement methods from prepare_cached do not.
    { path = "rusqlite::Connection::execute", reason = "prepares on every call; use prepare_cached" },
    { path = "rusqlite::Connection::query_row", reason = "prepares on every call; use prepare_cached" },
    { path = "rusqlite::Connection::query_one", reason = "prepares on every call; use prepare_cached" },
    { path = "rusqlite::Connection::prepare", reason = "prepares on every call; use prepare_cached" },
]

# Tests may unwrap and expect; production code must not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
