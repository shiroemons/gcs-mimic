# Directory synchronization override for compose.yaml:
#   mkdir -p sync
#   docker compose -f compose.yaml -f compose.sync.yaml up --wait
# Objects appear as BUCKET/OBJECT files under ./sync, and files you add or edit there become objects.
# Set GCSM_SYNC_DIR to use another host directory. Create it first: Docker does not make a missing
# bind source on the host, and the server refuses to start without the directory.
#
# On a Linux host the server must run as you, or it cannot write the directory, and you could not
# read what it writes (files are 0600). Docker Desktop maps ownership, so macOS does not need this:
#   mkdir -p sync data
#   export GCSM_UID=$(id -u) GCSM_DATA_DIR=./data
# GCSM_DATA_DIR moves the data out of the named volume, which belongs to UID 10001.
#
# The image's healthcheck stays in charge: `up --wait`, and a service that depends_on this one with
# condition: service_healthy, wait until the first pass has exported the existing objects.
services:
  gcs:
    user: "${GCSM_UID:-10001}"
    environment:
      GCS_MIMIC_SYNC_DIR: /sync
    volumes:
      # A name with no path is the named volume compose.yaml declares; ./data is a host directory.
      - ${GCSM_DATA_DIR:-gcs-data}:/var/lib/gcs-mimic
      - type: bind
        source: ${GCSM_SYNC_DIR:-./sync}
        target: /sync
        bind:
          create_host_path: false
