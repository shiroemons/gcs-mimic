services:
  gcs:
    build: .
    image: ${GCS_MIMIC_IMAGE:-gcs-mimic:dev}
    ports:
      - "127.0.0.1:${GCS_MIMIC_PORT:-4443}:4443"
    read_only: true
    volumes:
      - gcs-data:/var/lib/gcs-mimic
    environment:
      GCS_MIMIC_API_BASE_URL: ${GCS_MIMIC_API_BASE_URL:-https://localhost:${GCS_MIMIC_PORT:-4443}}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    stop_grace_period: 15s
volumes:
  gcs-data:
