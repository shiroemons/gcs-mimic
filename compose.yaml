services:
  gcs:
    build: .
    image: ${GCSM_IMAGE:-gcs-mimic:dev}
    ports:
      - "127.0.0.1:${GCSM_PORT:-4443}:4443"
    read_only: true
    volumes:
      - gcs-data:/var/lib/gcs-mimic
    environment:
      # Pass obsolete Compose names through only to get the server's replacement diagnostic.
      GCS_MIMIC_PORT:
      GCS_MIMIC_IMAGE:
      GCS_MIMIC_TLS_DIR:
      # No value: passed through only when set. Unset, URLs follow each request's Host.
      GCS_MIMIC_API_BASE_URL:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # A transfer in flight uses about 230 KiB, so 1024 connections need more than the idle size.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    ulimits:
      # max_connections defaults to 1024, and a connection can hold a socket and two files.
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 15s
volumes:
  gcs-data:
